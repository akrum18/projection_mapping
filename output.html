<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projector Output</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ov { pointer-events: none; }
  body.idle { cursor: none; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #ddd; font: 15px/1.6 system-ui, sans-serif;
          background: rgba(20,20,24,.85); border: 1px solid #444; border-radius: 10px; padding: 16px 22px; text-align: center; transition: opacity .6s; }
  #hint.hide { opacity: 0; pointer-events: none; }
  #hint b { color: #ff8800; }
  body.wall #ov { pointer-events: auto; cursor: crosshair; }
  #wall { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); color: #04160e; background: #34d399; padding: 6px 12px; border-radius: 8px; font: 600 13px system-ui, sans-serif; pointer-events: none; }
  #wall[hidden] { display: none; }
  #audio { position: absolute; right: 12px; bottom: 12px; color: #fff; background: #b02020; padding: 10px 14px; border-radius: 8px; font: 14px system-ui, sans-serif; cursor: pointer; display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hint">
  <div style="font-size:20px;margin-bottom:6px">🎃 Projector Output</div>
  Drag this window onto the projector screen, then press <b>F</b> (or double-click) for fullscreen.<br>
  <span id="conn">Waiting for the editor window…</span>
</div>
<div id="wall" hidden>Editing on wall · drag handles here · arrows nudge · W warp · Esc deselect</div>
<div id="audio">🔊 Click to enable sound</div>
<script type="module" src="js/output.js"></script>
</body>
</html>
